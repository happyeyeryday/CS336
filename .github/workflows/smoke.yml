name: CPU reproduction checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_repository.py

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        assignment: [assignment1-basics, assignment3-parallelism]
    defaults:
      run:
        working-directory: ${{ matrix.assignment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.12.19
      - run: uv sync --locked --extra cpu --python 3.11
      - name: Basics
        if: matrix.assignment == 'assignment1-basics'
        run: uv run --locked --extra cpu python examples/smoke.py
      - name: Distributed reference checks
        if: matrix.assignment == 'assignment3-parallelism'
        run: |
          for mode in ddp tp pp; do
            uv run --locked --extra cpu python examples/smoke.py --mode "$mode"
          done
